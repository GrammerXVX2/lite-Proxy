services:
  redis:
    image: redis:7-alpine
    container_name: lite-proxy-redis
    restart: unless-stopped
    command: redis-server --save "" --appendonly no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  lite-proxy:
    build:
      context: .
    container_name: lite-proxy
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - ./.env
    environment:
      - LITE_MODEL_CONFIG_FILE=models.json
      - UPSTREAM_TIMEOUT_SECONDS=120
      - REDIS_URL=redis://redis:6379
    ports:
      - "11434:11434"
    volumes:
      - ./models.json:/app/models.json:ro
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:11434/api/models', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s
